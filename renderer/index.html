<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASCII Life Terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg-stage" aria-hidden="true"></div>

  <div id="app">
    <header id="titlebar">
      <div class="brand"><span class="brand-mark">&#9678;</span> ASCII<span class="brand-dim">LIFE</span> TERMINAL</div>

      <div id="tabs" role="tablist" aria-label="Terminal tabs"></div>
      <button id="new-tab" class="tb-button add-tab" title="New tab (Ctrl+Shift+T)" aria-label="New tab">+</button>

      <div class="spacer"></div>

      <span class="scenes-label">BACKGROUND</span>
      <nav id="scenes" aria-label="Background scene"></nav>

      <div class="window-controls">
        <button id="win-min" class="tb-button wc" title="Minimize" aria-label="Minimize"><span>&#8722;</span></button>
        <button id="win-max" class="tb-button wc" title="Maximize" aria-label="Maximize"><span>&#9633;</span></button>
        <button id="win-close" class="tb-button wc close" title="Close" aria-label="Close"><span>&#215;</span></button>
      </div>
    </header>

    <main id="terminals" aria-label="Terminal">
      <div id="session-glass" aria-hidden="true"></div>
    </main>
  </div>

  <script src="../vendor/ascii-life.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
